server {
    listen 80;

    server_name localhost;

    # Old /blog links: the blog list now lives with every other tag list
    location = /blog {
        return 301 /tag/blog;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # Redirect URLs with trailing slash to URLs without trailing slash (except root)
        rewrite ^/(.*)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ $uri/index.html /index.html;
    }

    location = /sitemap.xml {
        alias /usr/share/nginx/html/sitemap.xml;
        add_header Content-Type application/xml;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}